name: Build Debian package

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      # Audited official linux/amd64 manifest, without installed CPU variants.
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      DEB_BUILD_OPTIONS: parallel=2
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Bootstrap a baseline Ubuntu 26.04 environment
        run: |
          # Set this BEFORE the first apt update/install. Disabling variants on
          # an already populated runner would not replace its installed inputs.
          cat > /etc/apt/apt.conf.d/99mainuan-baseline <<'APT'
          #clear APT::Architecture-Variants;
          APT::Architecture-Variants "";
          APT::Architecture "amd64";
          #clear APT::Architectures;
          APT::Architectures { "amd64"; };
          APT
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends build-essential dpkg-dev fakeroot lintian git ca-certificates python3 qemu-user
          useradd --create-home --uid 1001 --shell /bin/bash welcome-build

      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build tools and dependencies from debian/control
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get build-dep --yes --no-install-recommends ./
          dpkg-checkbuilddeps
          chown -R welcome-build:welcome-build "$GITHUB_WORKSPACE"
          chown welcome-build:welcome-build "$(dirname "$GITHUB_WORKSPACE")"
          runuser -u welcome-build -- python3 .github/scripts/check_cpu.py environment --output build/cpu-environment.json

      - name: Validate the version, tag and source integrity
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          chown welcome-build:welcome-build "$GITHUB_OUTPUT"
          runuser -u welcome-build -- bash -euo pipefail -c '
            test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
            git diff --check
            python3 -m unittest discover -s .github/scripts -p "test_*.py"
            python3 .github/scripts/check_release.py metadata --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          '

      - name: Compile
        run: |
          runuser -u welcome-build -- cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DMAINUAN_DEVELOPER_MODE=OFF
          runuser -u welcome-build -- cmake --build build --parallel 2
          runuser -u welcome-build -- python3 .github/scripts/check_cpu.py flags build/compile_commands.json --output build/cpu-flags.json

      - name: Run all QtTest, QML and startup tests without a desktop session
        run: |
          # CTest owns session isolation, also when invoked by dh_auto_test.
          runuser -u welcome-build -- ctest --test-dir build --parallel 1 --output-on-failure --output-junit release-tests.xml
          runuser -u welcome-build -- python3 .github/scripts/check_release.py tests build/release-tests.xml
          runuser -u welcome-build -- ctest --test-dir build --parallel 2 --output-on-failure --output-junit release-tests-parallel.xml
          runuser -u welcome-build -- python3 .github/scripts/check_release.py tests build/release-tests-parallel.xml

      - name: Build and validate the Debian package
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          runuser -u welcome-build -- bash -euo pipefail -c '
            dpkg-buildpackage -us -uc -b
            package="../mainuan-welcome_${PACKAGE_VERSION}_amd64.deb"
            python3 .github/scripts/check_release.py package "$package" --version "$PACKAGE_VERSION"
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
            lintian --fail-on error "$package"
            mkdir dist
            python3 .github/scripts/check_cpu.py package "$package" --output dist/cpu-elf.json
            python3 .github/scripts/check_cpu.py flags obj-x86_64-linux-gnu/compile_commands.json --output dist/cpu-flags.json
            python3 .github/scripts/check_cpu.py dependencies "$package" --output dist/cpu-dependencies.json
            python3 .github/scripts/cpu_smoke.py "$package" > dist/cpu-smoke.log 2>&1
            cp build/cpu-environment.json dist/
            cp -- "$package" dist/
            cd dist
            sha256sum "mainuan-welcome_${PACKAGE_VERSION}_amd64.deb" > SHA256SUMS
            sha256sum --check SHA256SUMS
          '

      - name: Upload the validated package and checksums
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainuan-welcome-${{ steps.metadata.outputs.version }}-${{ github.sha }}
          path: |
            dist/mainuan-welcome_${{ steps.metadata.outputs.version }}_amd64.deb
            dist/SHA256SUMS
            dist/cpu-*.json
            dist/cpu-smoke.log
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'mainuan/welcome'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or execution of repository scripts in the job with write access.
      - name: Download the artifact from the successful build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Publish only an existing matching tag, without replacing a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
          cd dist
          sha256sum --check SHA256SUMS
          package="mainuan-welcome_${PACKAGE_VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$package" Version)" = "$PACKAGE_VERSION"
          test "$(dpkg-deb -f "$package" Package)" = mainuan-welcome
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          cat > release-notes.md <<'NOTES'
          Aplicação nativa Qt 6/QML para Mainuan Linux, baseado no Kubuntu 26.04 LTS e KDE Plasma 6.

          Inclui instalação de aplicativos com progresso e autenticação Polkit, sete layouts do Plasma com backup e restauração, esquemas KDE, ícones Kora, wallpapers, avatar e relatório da máquina.

          Baixe o pacote Debian e SHA256SUMS e confira a integridade antes da instalação. GitHub Releases não constitui um repositório APT.

          Ao migrar de versões experimentais 2.3.1.x para 1.0, consulte o procedimento de downgrade documentado no README.
          NOTES
          # gh release create fails if the release already exists; never use --clobber.
          # --verify-tag prevents the CLI from creating a missing tag.
          gh release create "$RELEASE_TAG" "$package" SHA256SUMS \
            --verify-tag --title "Mainuan Welcome $PACKAGE_VERSION" --notes-file release-notes.md
